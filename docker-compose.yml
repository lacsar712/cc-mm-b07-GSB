services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: methane
    ports:
      - "54391:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d methane"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8191:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/methane
      JWT_SECRET: mine-methane-dev-secret
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3191:80"
    depends_on:
      - backend

volumes:
  pgdata:
